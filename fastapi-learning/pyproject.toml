[project]
name = "fastapi-learning"
version = "0.1.0"
description = "FastAPI 学习工程"
readme = "README.md"
authors = [
    { name = "QuanMou", email = "2312038309@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.161.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "tavily-python>=0.8.5",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
