<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket 聊天室</title>
<style>
  :root {
    --bg: #f1f3f9;
    --card: #ffffff;
    --text: #1a1d27;
    --text-soft: #6b7280;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --bubble-user: linear-gradient(135deg, #6366f1, #8b5cf6);
    --bubble-bot: #ffffff;
    --line: #e5e7eb;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 110%, #ede9fe 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .chat-app {
    width: 100%;
    max-width: 860px;
    height: min(700px, calc(100vh - 48px));
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(30, 41, 90, .14), 0 2px 8px rgba(30, 41, 90, .06);
    display: flex;
    overflow: hidden;
  }

  /* ---------- 左侧：在线用户 ---------- */
  .sidebar {
    width: 230px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: #fafbfe;
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    padding: 16px 18px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--text-soft);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .online-count {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    min-width: 18px; height: 18px;
    border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 5px;
  }
  .user-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 12px;
  }
  .user-list::-webkit-scrollbar { width: 5px; }
  .user-list::-webkit-scrollbar-thumb { background: #d7dae3; border-radius: 3px; }

  .user-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 10px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: background .15s;
  }
  .user-item:hover { background: #eef0fa; }
  .user-item.active { background: #e4e6ff; }
  .user-item.me { opacity: .55; cursor: default; }
  .user-item .u-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .user-item.me .u-avatar {
    background: linear-gradient(135deg, #94a3b8, #b6c0cd);
  }
  .user-item .u-name { font-size: 13.5px; font-weight: 600; }
  .user-item .u-state { font-size: 11px; color: #059669; display: flex; align-items: center; gap: 4px; }
  .user-item .u-state::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: #10b981;
  }
  .u-badge {
    margin-left: auto;
    background: #ef4444;
    color: #fff;
    font-size: 10.5px;
    min-width: 17px; height: 17px;
    border-radius: 9px;
    display: none; align-items: center; justify-content: center;
    padding: 0 5px;
  }
  .u-badge.show { display: inline-flex; }

  .empty-tip {
    text-align: center;
    color: #a7adc2;
    font-size: 12px;
    padding: 24px 12px;
    line-height: 1.7;
  }

  /* ---------- 右侧：聊天主区 ---------- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, .7);
    backdrop-filter: blur(8px);
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 13px;
    background: var(--bubble-user);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
    box-shadow: 0 6px 16px rgba(99, 102, 241, .35);
    flex-shrink: 0;
  }
  .title { font-size: 16px; font-weight: 700; }
  .subtitle { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

  .status {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    background: #fef2f2; color: #dc2626;
    transition: all .3s;
    flex-shrink: 0;
  }
  .status.connected { background: #ecfdf5; color: #059669; }
  .status.connecting { background: #fffbeb; color: #d97706; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }

  .chat-with {
    padding: 8px 22px;
    font-size: 12px;
    color: var(--text-soft);
    border-bottom: 1px solid var(--line);
    background: #fcfcff;
    display: none;
  }
  .chat-with.show { display: block; }
  .chat-with b { color: var(--accent); }

  /* ---------- 消息区 ---------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #d7dae3; border-radius: 3px; }

  .msg {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 14.5px;
    animation: rise .25s ease both;
    word-break: break-word;
    white-space: pre-wrap;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .msg .meta {
    display: block;
    font-size: 10.5px;
    margin-top: 5px;
    opacity: .55;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,.04);
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 6px 14px rgba(99, 102, 241, .28);
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-soft);
    font-size: 12px;
    padding: 2px 8px;
    max-width: 95%;
    text-align: center;
  }
  .msg.user .meta { color: rgba(255,255,255,.75); opacity: 1; }

  /* ---------- 输入区 ---------- */
  footer {
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
    background: rgba(255, 255, 255, .7);
    backdrop-filter: blur(8px);
  }
  .input {
    flex: 1;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border .2s, box-shadow .2s;
    background: #fafbfc;
  }
  .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, .12);
    background: #fff;
  }
  .input:disabled { opacity: .5; cursor: not-allowed; }

  .send {
    border: none;
    border-radius: 14px;
    padding: 0 20px;
    background: var(--bubble-user);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    box-shadow: 0 6px 14px rgba(99, 102, 241, .3);
  }
  .send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(99, 102, 241, .4); }
  .send:active:not(:disabled) { transform: translateY(0); }
  .send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

  .hint {
    text-align: center;
    font-size: 11.5px;
    color: #9ca3af;
    padding: 0 0 10px;
  }
  .hint code {
    background: #eef0f6;
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 11px;
  }

  @media (max-width: 640px) {
    .chat-app { height: calc(100vh - 24px); border-radius: 18px; }
    .sidebar { width: 170px; }
  }
</style>
</head>
<body>
<div class="chat-app">
  <!-- 左侧：在线用户列表 -->
  <aside class="sidebar">
    <div class="sidebar-head">在线用户 <span class="online-count" id="onlineCount">0</span></div>
    <div class="user-list" id="userList">
      <div class="empty-tip">尚未获取到在线名单<br>连接服务端后自动加载</div>
    </div>
  </aside>

  <!-- 右侧：聊天主区 -->
  <div class="main">
    <header>
      <div class="avatar" id="avatar">F</div>
      <div>
        <div class="title">FastAPI 聊天助手</div>
        <div class="subtitle">WebSocket 多用户 · /ws/{user_id}</div>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">连接中…</span></div>
    </header>

    <div class="chat-with" id="chatWith"></div>

    <div class="messages" id="messages"></div>

    <footer>
      <input class="input" id="input" type="text" placeholder="输入消息，回车发送…"
             autocomplete="off" disabled>
      <button class="send" id="sendBtn" disabled>发送</button>
    </footer>
    <div class="hint">左侧点选用户后发送即私聊 · 服务：<code>ws://127.0.0.1:8090/ws/{user_id}</code></div>
  </div>
</div>

<script>
  const messagesEl  = document.getElementById("messages");
  const inputEl     = document.getElementById("input");
  const sendBtn     = document.getElementById("sendBtn");
  const statusEl    = document.getElementById("status");
  const statusText  = document.getElementById("statusText");
  const avatarEl    = document.getElementById("avatar");
  const userListEl  = document.getElementById("userList");
  const onlineCntEl = document.getElementById("onlineCount");
  const chatWithEl  = document.getElementById("chatWith");

  // 从 URL 取 user_id，如 chat.html?user_id=1 ；没传则随机分配一个 1~99 的临时身份
  // （可开两个浏览器窗口，分别 ?user_id=1 和 ?user_id=2 模拟两个用户聊天）
  const params = new URLSearchParams(location.search);
  let userId = parseInt(params.get("user_id"), 10);
  if (!Number.isInteger(userId) || userId <= 0) {
    userId = Math.floor(Math.random() * 99) + 1;
  }
  avatarEl.textContent = userId;

  // 页面通过 http 服务打开时跟随当前域名；直接双击打开(file://)则连本地 8090
  function wsUrl() {
    return "ws://127.0.0.1:8090/ws/" + userId;
  }

  let ws = null;
  let onlineUsers = [];   // 服务端广播来的在线名单
  let chatTarget = null;  // 当前选中的私聊对象；null = 未选（回显模式）

  function now() {
    return new Date().toLocaleTimeString("zh-CN", { hour12: false });
  }

  function addMsg(text, who, label) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    if (who !== "system") {
      const t = document.createElement("span");
      t.className = "meta";
      t.textContent = (label ? label + " · " : "") + now();
      div.appendChild(t);
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setStatus(mode, text) {
    statusEl.className = "status" + (mode ? " " + mode : "");
    statusText.textContent = text;
  }

  function setEnabled(on) {
    inputEl.disabled = !on;
    sendBtn.disabled = !on;
  }

  /* ---------- 在线用户列表 ---------- */
  function renderUserList() {
    onlineCntEl.textContent = onlineUsers.length;
    if (!onlineUsers.length) {
      userListEl.innerHTML = '<div class="empty-tip">当前没有其他在线用户<br>可再开一个窗口 <code>?user_id=2</code></div>';
      return;
    }
    userListEl.innerHTML = "";
    for (const uid of onlineUsers) {
      const isMe = uid === userId;
      const btn = document.createElement("button");
      btn.className = "user-item" + (isMe ? " me" : "") + (uid === chatTarget ? " active" : "");
      btn.innerHTML =
        `<span class="u-avatar">${uid}</span>` +
        `<span><span class="u-name">用户 ${uid}</span><br>` +
        `<span class="u-state">在线</span></span>` +
        (isMe ? "" : `<span class="u-badge" data-badge="${uid}"></span>`);
      if (!isMe) {
        btn.title = "点击开始私聊";
        btn.addEventListener("click", () => selectTarget(uid));
      }
      userListEl.appendChild(btn);
    }
  }

  function selectTarget(uid) {
    chatTarget = (chatTarget === uid) ? null : uid;  // 再点一次取消选中
    renderUserList();
    updateChatWith();
    inputEl.focus();
  }

  function updateChatWith() {
    if (chatTarget == null) {
      chatWithEl.className = "chat-with";
      chatWithEl.innerHTML = "";
    } else {
      chatWithEl.className = "chat-with show";
      chatWithEl.innerHTML = `正在与 <b>用户 ${chatTarget}</b> 私聊（消息将发送给对方）`;
    }
  }

  function setBadge(uid, on) {
    const b = userListEl.querySelector(`[data-badge="${uid}"]`);
    if (b) b.className = "u-badge" + (on ? " show" : "");
  }

  /* ---------- WebSocket ---------- */
  function connect() {
    setStatus("connecting", "连接中…");
    ws = new WebSocket(wsUrl());

    ws.onopen = () => {
      setStatus("connected", "已连接 · 用户 " + userId);
      setEnabled(true);
      addMsg(`已以用户 ${userId} 的身份连接到服务端`, "system");
      inputEl.focus();
    };

    ws.onmessage = (e) => {
      // 服务端消息统一为 JSON；解析失败按普通文本展示（兼容回显协议）
      let data = null;
      try { data = JSON.parse(e.data); } catch (_) { /* 不是 JSON */ }

      if (data && data.type === "online") {
        // 在线名单更新：记录并重绘；已断线的聊天对象自动取消选中
        onlineUsers = data.users.filter(u => u !== userId);
        if (chatTarget != null && !onlineUsers.includes(chatTarget)) {
          chatTarget = null;
          updateChatWith();
        }
        renderUserList();
      } else if (data && data.type === "chat") {
        // 私聊消息：from 是对方；发送方收到的是自己发出的副本
        const mine = data.from === userId;
        addMsg(data.content, mine ? "user" : "bot",
               mine ? `发给用户 ${data.from}` : `用户 ${data.from}`);
        if (!mine && data.from !== chatTarget) setBadge(data.from, true);
      } else {
        addMsg(e.data, "bot");  // 纯文本回显
      }
    };

    ws.onclose = () => {
      setStatus("", "未连接");
      setEnabled(false);
      onlineUsers = [];
      renderUserList();
      addMsg("连接已断开（服务端停止或网络断开），重启服务后刷新页面重连", "system");
    };

    ws.onerror = () => setStatus("", "连接失败");
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    if (chatTarget != null) {
      // 私聊：JSON {to, content}，服务端转发给对方，并回发副本给自己
      ws.send(JSON.stringify({ to: chatTarget, content: text }));
    } else {
      // 未选对象：按老协议发纯文本，服务端回显
      ws.send(text);
    }
    inputEl.value = "";
    inputEl.focus();
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });

  renderUserList();
  connect();
</script>
</body>
</html>
