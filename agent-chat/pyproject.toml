[project]
name = "agent-chat"
version = "0.1.0"
description = "综合学习项目：FastAPI + LangGraph Agent + SSE 流式 + MySQL + JWT 认证"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.21.0",
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=2.1.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
dev = "app.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
