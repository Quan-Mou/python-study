[project]
name = "hitl-demo"
version = "0.1.0"
description = "Human-In-The-Loop 演示项目，基于 LangGraph 中断机制"
readme = "README.md"
authors = [
    { name = "QuanMou", email = "2312038309@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "langchain==1.4.2",
    "langchain-openai==1.7.1",
    "langgraph>=1.2.13",
    "langsmith>=0.14.11",
    "openai>=3.16.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
hitl-demo = "hitl_demo.agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.34",
]
