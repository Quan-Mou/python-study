[project]
name = "langgraph-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QuanMou", email = "2312038309@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.13",
    "langgraph-checkpoint>=4.1.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langsmith>=0.14.4",
    "loguru>=0.7.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
langgraph-learning = "langgraph_learning:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.34",
]
