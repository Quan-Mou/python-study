    <script>
        const result = document.getElementById("result");

        // uv run python -m uvicorn --app-dir src stream.main:app --port 8090

        const eventSource = new EventSource("http://127.0.0.1:8090/sse");

        eventSource.onmessage = function (event) {
            console.log(event);
            console.log(event.data);
            const data = JSON.parse(event.data);

            // 防御：content 不存在（如 done 的 {}）就跳过，避免出现 undefined
            if (data && data.content !== undefined) {
                result.innerHTML += data.content;
            }
        };

        eventSource.addEventListener("done", function () {
            console.log("生成完成");
            eventSource.close();   // 正常结束，主动关闭，阻止重连
        });

        eventSource.onerror = function (e) {
            console.log("SSE 连接发生异常/已结束");
            eventSource.close();   // ★ 关键：这里也 close，否则会自动重连
        };
    </script>
